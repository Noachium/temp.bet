name: Steam Build Checker

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes (github's minimum)
  workflow_dispatch:        # lets you trigger it manually from the actions tab too

permissions:
  contents: write           # needed to commit the updated json back to the repo

jobs:
  check-build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install requests

      - name: run build checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
        run: python steam_build_checker_ci.py

      - name: commit updated json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build_id.json
          git diff --staged --quiet || git commit -m "chore: update build id [skip ci]"
          git push
